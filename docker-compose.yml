# Producción v2 (despliegue aislado). No incluye el panel legacy Express/EJS.
services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: mali-whatsapp-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      API_PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - npm_proxy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: mali-whatsapp-web
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - default
      - npm_proxy

  postgres:
    image: postgres:16-alpine
    container_name: mali-whatsapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  redis:
    image: redis:7-alpine
    container_name: mali-whatsapp-redis
    restart: unless-stopped
    networks:
      - default

volumes:
  postgres_data:

networks:
  npm_proxy:
    external: true
    name: nginx-proxy-manager_default
