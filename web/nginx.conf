server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Vite incluye un hash en los nombres; una versión nueva usa otra URL.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # El visor de PDF carga pdf.worker.min.*.mjs como módulo.
  # Sin este tipo, nginx lo sirve como octet-stream y el navegador lo rechaza.
  location ~* \.mjs$ {
    types { }
    default_type application/javascript;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # PDFs y adjuntos de conversación (API: hasta 25 MB).
  client_max_body_size 25m;

  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /health {
    proxy_pass http://api:4000;
  }

  location /webhook {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
